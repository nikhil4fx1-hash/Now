name: Amazon Now Tracker

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [trigger-scraper]
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Create Cookies JSON
        run: |
          cat << 'EOF' > cookies.json
          ${{ secrets.AMAZON_COOKIES }}
          EOF

      - name: Run Scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          AMAZON_URL: ${{ secrets.AMAZON_URL }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
        run: python bot.py

      - name: Commit and Push Updated Prices
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add amazon_now_prices.json
          # ആദ്യം മാറ്റങ്ങൾ സേവ് ചെയ്യുന്നു (മാറ്റങ്ങൾ ഇല്ലെങ്കിൽ എറർ വരാതിരിക്കാൻ || true നൽകിയിരിക്കുന്നു)
          git commit -m "Update price database" || true
          # അതിനുശേഷം മാത്രം pull ചെയ്ത് push ചെയ്യുന്നു
          git pull origin main --rebase
          git push
